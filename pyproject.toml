[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slackbot"
version = "1.0.0"
authors = [
  { name="Peter van de Riet", email="vdriet@gmail.com" },
]
description = "Slackbot in Docker"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/vdriet/slackbot"
Issues = "https://github.com/vdriet/slackbot/issues"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

dependencies = [
  "certifi==2024.8.30",
  "charset-normalizer==3.4.0",
  "idna==3.10",
  "imap-tools==1.7.4",
  "pytest==8.3.3",
  "pytz==2024.2",
  "requests==2.32.3",
  "six==1.16.0",
  "slack_sdk==3.33.4",
  "urllib3==2.2.3",
]
